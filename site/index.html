<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Red PT-BR - Mod Index</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 3rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #333;
            margin-bottom: 1rem;
            font-size: 2.5rem;
        }
        .subtitle {
            color: #666;
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }
        .mod-card {
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
        }
        .mod-card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
        }
        .mod-name {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        .mod-version {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.875rem;
            margin-left: 0.5rem;
        }
        .mod-description {
            color: #666;
            margin-bottom: 1rem;
            line-height: 1.6;
        }
        .mod-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .tag {
            background: #f0f0f0;
            padding: 0.25rem 0.75rem;
            border-radius: 6px;
            font-size: 0.875rem;
            color: #555;
        }
        .download-btn {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .download-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
        .install-guide {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 1.5rem;
            margin-top: 2rem;
            border-radius: 8px;
        }
        .install-guide h3 {
            color: #333;
            margin-bottom: 1rem;
        }
        .install-guide code {
            background: white;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            display: block;
            margin-top: 0.5rem;
            font-family: 'Courier New', monospace;
            color: #667eea;
        }
        .footer {
            text-align: center;
            margin-top: 2rem;
            color: #888;
            font-size: 0.875rem;
        }
        .footer a {
            color: #667eea;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🇧🇷 Pokémon Red PT-BR</h1>
        <p class="subtitle">Mods em português brasileiro para gen1recomp</p>

        <div id="mods-container">
            <p>Carregando mods...</p>
        </div>

        <div class="install-guide">
            <h3>📥 Como Instalar</h3>
            <p><strong>Opção 1:</strong> Adicione este index no gen1recomp:</p>
            <code>raphabarreto/pokered-ptbr</code>
            
            <p style="margin-top: 1rem;"><strong>Opção 2:</strong> Link direto:</p>
            <code id="index-url">Carregando...</code>
        </div>

        <div class="footer">
            <p>
                <a href="https://github.com/raphabarreto/pokered-ptbr" target="_blank">📦 GitHub</a> •
                <a href="https://github.com/raphabarreto/pokered-ptbr/releases" target="_blank">📥 Releases</a> •
                <a href="https://github.com/raphabarreto/pokered-ptbr/issues" target="_blank">🐛 Report Bug</a>
            </p>
        </div>
    </div>

    <script>
        async function loadMods() {
            try {
                const response = await fetch('./data/index.json');
                const data = await response.json();
                
                const indexUrl = window.location.origin + window.location.pathname.replace('index.html', '') + 'data/index.json';
                document.getElementById('index-url').textContent = indexUrl;
                
                const container = document.getElementById('mods-container');
                container.innerHTML = '';
                
                data.mods.forEach(mod => {
                    const modCard = document.createElement('div');
                    modCard.className = 'mod-card';
                    
                    modCard.innerHTML = `
                        <div class="mod-name">
                            ${mod.name}
                            <span class="mod-version">v${mod.version}</span>
                        </div>
                        <p class="mod-description">${mod.description}</p>
                        <div class="mod-tags">
                            ${mod.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                        </div>
                        <a href="${mod.download_url}" class="download-btn" target="_blank">
                            📥 Download
                        </a>
                    `;
                    
                    container.appendChild(modCard);
                });
            } catch (error) {
                console.error('Erro ao carregar mods:', error);
                document.getElementById('mods-container').innerHTML = 
                    '<p style="color: #e74c3c;">❌ Erro ao carregar mods. Tente novamente mais tarde.</p>';
            }
        }
        
        loadMods();
    </script>
</body>
</html>
