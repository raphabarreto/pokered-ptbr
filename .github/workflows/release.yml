name: Release Pokémon Red PT-BR

# Automatically packages all mods and creates a GitHub Release when:
# - A tag starting with "v" is pushed (e.g., v0.2.0)
# - Manually triggered with workflow_dispatch

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.2.0)'
        required: true
        type: string
      changelog:
        description: 'Changelog summary'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get version from tag or input
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi
          echo "Releasing version: ${VERSION}"
      
      - name: Package mods
        run: |
          mkdir -p dist
          
          # For each mod directory
          for mod_dir in mods/*/; do
            mod_name=$(basename "$mod_dir")
            manifest="$mod_dir/manifest.json"
            
            if [ -f "$manifest" ]; then
              echo "📦 Packaging $mod_name..."
              
              # Extract version from manifest (remove date if present)
              mod_version=$(jq -r '.version' "$manifest" | sed 's/ (.*//')
              
              # Create zip with mod name and version
              zip_name="${mod_name}-${mod_version}.zip"
              
              cd "$mod_dir"
              zip -r "../../dist/$zip_name" . \
                -x "*.git*" \
                -x "*.md" \
                -x "tests/*" \
                -x ".modkitignore"
              cd ../..
              
              echo "   ✅ Created dist/$zip_name"
            else
              echo "   ⚠️ Skipping $mod_name (no manifest.json)"
            fi
          done
          
          echo ""
          echo "📋 Packaged files:"
          ls -lh dist/
      
      - name: Generate release notes
        id: notes
        run: |
          NOTES="## 📦 Mods Incluídos / Included Mods"
          NOTES="${NOTES}\n\n"
          
          # List all mods with versions
          for mod_dir in mods/*/; do
            manifest="$mod_dir/manifest.json"
            if [ -f "$manifest" ]; then
              mod_name=$(jq -r '.name' "$manifest")
              mod_version=$(jq -r '.version' "$manifest" | sed 's/ (.*//')
              NOTES="${NOTES}- **${mod_name}** v${mod_version}\n"
            fi
          done
          
          NOTES="${NOTES}\n---\n\n"
          NOTES="${NOTES}## 📥 Instalação / Installation\n\n"
          NOTES="${NOTES}**PT-BR:**\n"
          NOTES="${NOTES}1. Baixe o mod desejado (.zip)\n"
          NOTES="${NOTES}2. Abra gen1recomp → MODS → Import mod .zip\n"
          NOTES="${NOTES}3. Ative o mod e reinicie o jogo\n\n"
          NOTES="${NOTES}**EN:**\n"
          NOTES="${NOTES}1. Download the desired mod (.zip)\n"
          NOTES="${NOTES}2. Open gen1recomp → MODS → Import mod .zip\n"
          NOTES="${NOTES}3. Enable the mod and restart the game\n\n"
          NOTES="${NOTES}---\n\n"
          
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.changelog }}" ]; then
            NOTES="${NOTES}## ✨ Novidades / What's New\n\n"
            NOTES="${NOTES}${{ github.event.inputs.changelog }}\n\n"
          fi
          
          NOTES="${NOTES}**Compatível com gen1recomp v0.1.38+**\n"
          NOTES="${NOTES}\n📚 [Documentação](https://github.com/${{ github.repository }})"
          
          # Save to output (escape newlines)
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo -e "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }} - Pokémon Red PT-BR
          body: ${{ steps.notes.outputs.notes }}
          files: dist/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Release complete
        run: |
          echo "✅ Release ${{ steps.version.outputs.tag }} published!"
          echo "🔗 https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}"
          echo ""
          echo "📦 Mods incluídos:"
          ls -lh dist/
